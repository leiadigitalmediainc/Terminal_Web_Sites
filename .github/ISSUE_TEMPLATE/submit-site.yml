name: Add a site to the Terminal Directory
description: List a site made with Terminal Web Builder, so Terminal Web users can find it.
title: "Add a site"
body:
  - type: markdown
    attributes:
      value: |
        Only sites made with **Terminal Web Builder** can be added. A robot checks the site
        against the [directory rules](https://leiadigitalmediainc.github.io/Terminal_Web_Sites/directory/rules.html)
        and answers here within a few minutes. Sites that may break the rules are held for a
        person to review.
  - type: input
    id: url
    attributes:
      label: Site address
      description: The full address of your site's first page.
      placeholder: https://yourname.github.io/my-site/
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Directory rules
      options:
        - label: My site follows the [Terminal Directory rules](https://leiadigitalmediainc.github.io/Terminal_Web_Sites/directory/rules.html) - no hate speech, threats, sexual content, illegal goods, scams, private information or pirated material.
          required: true
