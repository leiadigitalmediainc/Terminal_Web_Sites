name: Update sites

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node generator/build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      # GitHub pauses scheduled jobs in a repo with no activity for 60 days, so one small
      # commit a day keeps the sites updating with nobody touching them. The same commit saves
      # the directory's pages, read once a day, so the next runs do not read them again.
      # sites the daily check just hid get an issue, so the directory's owner hears about them
      - name: Tell the owner about held sites
        env:
          GH_TOKEN: ${{ github.token }}
        run: node generator/notify-holds.js
      - name: Save the day's work
        run: |
          date -u +%Y-%m-%d > data/last-run.txt
          git add data/last-run.txt directory/sites.json
          git add data/directory-index.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Daily heartbeat"
            git pull --rebase
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
